version: "3"

tasks:
  templ:
    desc: Generate templ templates, serve app via proxy, and hot-reload on changes
    cmds:
      - templ generate --watch --proxy="http://localhost:4000" --cmd="env TEMPL_DEV_MODE_WATCH_ROOT=views go run ." --open-browser=false

  tailwind:
    desc: Watch and rebuild Tailwind CSS stylesheet automatically
    cmds:
      - |
        TEMPLUI_PATH="$(go list -mod=mod -m -f {{`'{{.Dir}}'`}} github.com/templui/templui)" && \
        printf '%s\n' \
          '@source "./**/*.templ";' \
          '@source "./**/*.js";' \
          "@source \"$TEMPLUI_PATH/components/**/*.templ\";" \
          "@source \"$TEMPLUI_PATH/components/**/*.js\";" \
          > ./assets/css/sources.generated.css && \
        NODE_OPTIONS="" tailwindcss -i ./assets/css/input.css -o ./public/css/output.css --watch

  dev:
    desc: Run templ and Tailwind watchers in parallel for hot-reload development
    cmds:
      - go-task --parallel tailwind templ

