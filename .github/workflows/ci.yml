name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v ./...

      - name: Build CLI
        run: go build -v -o regius ./cmd/cli

  scaffold-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build CLI
        run: go build -v -o regius ./cmd/cli

      - name: Create smoke directory
        run: mkdir -p /tmp/smoke

      - name: Scaffold a new app and build it
        run: |
          "$GITHUB_WORKSPACE/regius" new smoketest
          cd smoketest
          go mod tidy
          go build ./...
        working-directory: /tmp/smoke
